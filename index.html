<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ISIDOR CLONE IA</title><style>body{background:#0a2e1e;color:#fff;font-family:sans-serif;text-align:center;padding:20px;margin:0}h1{font-size:28px}input{width:92%;padding:18px;border-radius:14px;border:none;font-size:16px;margin-top:15px}#box{background:#fff;color:#000;border-radius:14px;padding:12px;margin:20px auto;min-height:180px;width:92%;text-align:left}#box img{width:100%;border-radius:10px;margin-top:10px}button{width:92%;padding:16px;border-radius:14px;border:none;font-weight:bold;margin-top:10px;font-size:16px}</style></head><body><h1>ISIDOR CLONE IA</h1><input id="p" placeholder="Que veux tu imaginer ? ex: lion à Ouaga"><div id="box">Resultat va apparaitre ici...</div><button style="background:#7CFC7C" onclick="go()">IMAGINER COMME META AI</button><button style="background:#00D26A;color:#fff" onclick="w()">AUTORISER WhatsApp</button><button style="background:#fff" onclick="s()">AUTORISER Messages</button><script>let last="";function go(){let v=document.getElementById('p').value;if(!v)return alert('Tape quelque chose');let b=document.getElementById('box');b.innerHTML='⏳ Isidor imagine: '+v+'...';let u='https://image.pollinations.ai/prompt/'+encodeURIComponent(v)+'?width=1024&height=1024&nologo=true&seed='+Math.random();last=u;b.innerHTML='Resultat pour: <b>'+v+'</b><br><img src="'+u+'">';}function w(){window.open('https://wa.me/?text='+encodeURIComponent((document.getElementById('p').value||'')+' '+last+' https://isidor-clone-ia.onrender.com'))}function s(){window.open('sms:?body='+encodeURIComponent((document.getElementById('p').value||'')+' '+last))}</script></body></html>
